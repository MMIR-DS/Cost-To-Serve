name: CI

on:
  push:
  pull_request:

# CI validates code and outputs but never needs to write to the repository.
permissions:
  contents: read

jobs:
  full-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full Olist pipeline and tests
        run: python run_pipeline.py --tests
