name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  full-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full Olist pipeline and tests
        run: python run_pipeline.py --tests

      - name: Commit regenerated tracked outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs docs README.md
          if git diff --cached --quiet; then
            echo "No tracked output/documentation changes."
          else
            git commit -m "Refresh full-data Olist pipeline outputs"
            git push
          fi
