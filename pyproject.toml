[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-contribution-after-cts"
version = "1.0.0"
description = "Customer Contribution After Cost-to-Serve (portfolio prototype)"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<3",
  "numpy>=1.24,<3",
  "pytest>=7.0,<9",
  "plotly>=5.0,<6",
  "streamlit>=1.28,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
